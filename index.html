
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>セリフ異世界転生</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Kaisei+Decol:wght@500;700&family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --page: #edf2f7;
  --ink: #26364a;
  --sub: #718096;
  --line: #d3dce7;
  --blue: #496b9b;
  --blue-dark: #34547f;
  --white: #ffffff;
  --serif: "Kaisei Decol", "Yu Mincho", serif;
  --sans: "M PLUS Rounded 1c", "Yu Gothic", sans-serif;
}

* { box-sizing: border-box; }

html { scroll-behavior: smooth; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--sans);
  color: var(--ink);
  background-color: var(--page);
  background-image: radial-gradient(#cbd6e2 0.8px, transparent 0.8px);
  background-size: 18px 18px;
  line-height: 1.7;
}

button, textarea { font: inherit; }

.page-shell {
  width: min(100% - 28px, 760px);
  margin: 0 auto;
  padding: 24px 0 54px;
}

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 34px;
}

.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 800;
  letter-spacing: .04em;
  font-size: .9rem;
}

.logo-mark {
  display: grid;
  place-items: center;
  width: 32px;
  height: 32px;
  color: white;
  background: var(--blue);
  border-radius: 10px;
  font-size: 1rem;
}

.top-label {
  font-family: "DM Mono", monospace;
  font-size: .68rem;
  color: var(--sub);
  letter-spacing: .1em;
}

.hero {
  text-align: center;
  margin-bottom: 28px;
}

.eyebrow {
  display: inline-block;
  margin: 0 0 10px;
  padding: 4px 13px;
  border: 1px solid #c4d2e2;
  border-radius: 30px;
  color: var(--blue);
  background: rgba(255,255,255,.55);
  font-family: "DM Mono", monospace;
  font-size: .7rem;
  letter-spacing: .12em;
}

h1 {
  margin: 0;
  font-family: var(--serif);
  font-size: clamp(2rem, 7vw, 3rem);
  font-weight: 700;
  letter-spacing: .06em;
  line-height: 1.45;
}

.hero-sub {
  margin: 10px 0 0;
  color: var(--sub);
  font-size: .9rem;
}

.workbench {
  position: relative;
  padding: 25px;
  background: rgba(255,255,255,.94);
  border: 1px solid #d5deea;
  border-radius: 20px;
  box-shadow: 0 12px 35px rgba(48,68,92,.08);
}

.workbench::before {
  content: "";
  position: absolute;
  inset: 7px;
  border: 1px dashed #d8e1eb;
  border-radius: 14px;
  pointer-events: none;
}

.step {
  position: relative;
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 13px;
  font-size: 1rem;
  font-weight: 800;
}

.step-number {
  display: grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 8px;
  color: white;
  background: var(--blue);
  font-family: "DM Mono", monospace;
  font-size: .75rem;
}

.step-caption {
  margin-left: auto;
  color: #96a3b3;
  font-family: "DM Mono", monospace;
  font-size: .65rem;
  font-weight: 400;
  letter-spacing: .06em;
}

.field { position: relative; margin-bottom: 26px; }

textarea {
  display: block;
  width: 100%;
  min-height: 112px;
  resize: vertical;
  padding: 15px 17px;
  border: 1.5px solid #d3dce7;
  border-radius: 12px;
  background: #f7f9fc;
  color: var(--ink);
  font-size: 16px;
  line-height: 1.8;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}

textarea:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(73,107,155,.1);
}

textarea::placeholder { color: #a3afbd; }

.count {
  margin-top: 5px;
  text-align: right;
  color: #8b98a8;
  font-family: "DM Mono", monospace;
  font-size: .72rem;
}

.character-grid {
  display: grid;
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 9px;
  margin: 0 0 25px;
  padding: 0;
  list-style: none;
}

.character-button {
  position: relative;
  min-height: 76px;
  padding: 10px 5px;
  border: 1.5px solid #d7e0e9;
  border-radius: 12px;
  background: #f8fafc;
  color: var(--ink);
  cursor: pointer;
  text-align: center;
  transition: transform .15s, border-color .15s, background .15s;
}

.character-button:hover { transform: translateY(-2px); }

.character-button[aria-pressed="true"] {
  border: 2px solid var(--char-color);
  background: #fff;
  box-shadow: 0 3px 12px color-mix(in srgb, var(--char-color) 18%, transparent);
}

.character-button .symbol {
  display: block;
  margin-bottom: 3px;
  color: var(--char-color);
  font-size: 1.15rem;
  line-height: 1.3;
}

.character-button b {
  display: block;
  font-size: .78rem;
  line-height: 1.4;
}

.character-button .description {
  display: block;
  margin-top: 3px;
  color: #8a97a7;
  font-size: .58rem;
  line-height: 1.3;
}

.selected-note {
  min-height: 24px;
  margin: -13px 0 17px;
  color: var(--sub);
  text-align: center;
  font-size: .78rem;
}

.go {
  position: relative;
  display: block;
  width: 100%;
  min-height: 58px;
  border: 0;
  border-radius: 13px;
  color: #fff;
  background: linear-gradient(135deg, #5478a8, #365781);
  box-shadow: 0 5px 0 #29466b, 0 9px 18px rgba(49,77,113,.17);
  font-size: 1.05rem;
  font-weight: 800;
  letter-spacing: .08em;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
}

.go:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 7px 0 #29466b, 0 12px 20px rgba(49,77,113,.2);
}

.go:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 2px 0 #29466b;
}

.go:disabled {
  opacity: .45;
  cursor: not-allowed;
  box-shadow: none;
}

.status {
  min-height: 22px;
  margin: 13px 0 0;
  color: #b34c4c;
  text-align: center;
  font-size: .8rem;
}

.reply {
  margin-top: 25px;
  padding: 22px;
  border: 2px solid var(--racc);
  border-radius: 16px;
  background: var(--rbg);
  color: var(--rink);
  box-shadow: 0 8px 22px rgba(36,52,72,.08);
}

.reply[hidden] { display: none; }

.reply-heading {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 13px;
}

.reply-icon {
  display: grid;
  place-items: center;
  width: 30px;
  height: 30px;
  border-radius: 9px;
  color: var(--rcopy);
  background: var(--racc);
}

.reply .who {
  margin: 0;
  color: var(--racc);
  font-size: .88rem;
  font-weight: 800;
}

.reply .text {
  margin: 0;
  font-size: 1.08rem;
  line-height: 1.95;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}

.copy {
  min-height: 42px;
  margin-top: 17px;
  padding: 0 18px;
  border: 0;
  border-radius: 9px;
  color: var(--rcopy);
  background: var(--racc);
  font-size: .83rem;
  font-weight: 800;
  cursor: pointer;
}

.copy:hover { filter: brightness(1.08); }

.reply.in { animation: rise .35s ease-out; }

@keyframes rise {
  from { opacity: 0; transform: translateY(9px); }
  to { opacity: 1; transform: none; }
}

.footer {
  margin-top: 26px;
  color: #8b98a8;
  text-align: center;
  font-family: "DM Mono", monospace;
  font-size: .65rem;
  letter-spacing: .08em;
}

/* キャラクター別カラー：返事の欄だけに適用 */
[data-t="chuuni"] {
  --rbg: #160a24; --rink: #eadcff; --racc: #9b4dff; --rcopy: #fff;
}
[data-t="samurai"] {
  --rbg: #fbf8f2; --rink: #2a2422; --racc: #b3201f; --rcopy: #fff;
}
[data-t="god"] {
  --rbg: linear-gradient(160deg,#fffef8,#fbf0c8); --rink: #4a3a0c; --racc: #c9a227; --rcopy: #3a2c05;
}
[data-t="maou"] {
  --rbg: #14060a; --rink: #f4dadd; --racc: #b0121f; --rcopy: #fff;
}
[data-t="ai"] {
  --rbg: #05070f; --rink: #c4ecff; --racc: #19d2ff; --rcopy: #03121a;
}
[data-t="cat"] {
  --rbg: #fff3d9; --rink: #5a3a17; --racc: #ee8326; --rcopy: #2f1700;
}
[data-t="himmel"] {
  --rbg: #edf5ff; --rink: #24466d; --racc: #3985c9; --rcopy: #102b49;
}
[data-t="chappy"] {
  --rbg: #f1fbea; --rink: #1f4a22; --racc: #2fa84a; --rcopy: #03200a;
}
[data-t="claude"] {
  --rbg: #fcf8f3; --rink: #3a2f28; --racc: #bf6f3e; --rcopy: #fff;
}
[data-t="copilot"] {
  --rbg: #f0f7ff; --rink: #12365f; --racc: #1e7ae0; --rcopy: #fff;
}

[data-t="samurai"] .text,
[data-t="god"] .text { font-family: var(--serif); }

[data-t="god"].reply {
  box-shadow: 0 0 0 3px #fffdf0, 0 0 0 5px #e1c552;
}
[data-t="ai"].reply { box-shadow: 0 0 18px rgba(25,210,255,.35); }
[data-t="maou"].reply { box-shadow: inset 0 0 28px rgba(176,18,31,.35); }
[data-t="chuuni"].reply { box-shadow: 0 0 18px rgba(155,77,255,.35); }
[data-t="cat"].reply,
[data-t="himmel"].reply { border-radius: 24px; }


@media (max-width: 600px) {
  .page-shell {
    width: calc(100% - 22px);
    padding-top: 16px;
  }

  .topbar { margin-bottom: 24px; }
  .hero { margin-bottom: 22px; }

  .workbench {
    padding: 19px 15px;
  }

  .character-grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    width: 100%;
    justify-items: stretch;
  }

  .character-grid li {
    width: 100%;
    min-width: 0;
  }

  .character-button {
    display: block;
    width: 100%;
    min-width: 0;
    min-height: 76px;
    padding: 10px 5px;
  }

  .character-button b {
    overflow-wrap: anywhere;
  }

  .character-button .description {
    font-size: .62rem;
  }

  .step-caption {
    font-size: .58rem;
  }
}


@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}
</style>
</head>

<body>
<div class="page-shell">

  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">✦</span>
      <span>セリフ異世界転生</span>
    </div>
    <span class="top-label">ANOTHER WORLD / AI</span>
  </header>

  <section class="hero">
    <p class="eyebrow">YOUR WORDS, ANOTHER WORLD</p>
    <h1>セリフ異世界転生</h1>
    <p class="hero-sub">あなたの一言が、別の世界のキャラクターになって返ってくる。</p>
  </section>

  <main class="workbench">

    <section class="field">
      <h2 class="step">
        <span class="step-number">01</span>
        あなたのセリフ
        <span class="step-caption">YOUR MESSAGE</span>
      </h2>
      <textarea id="line" maxlength="200" placeholder="例：今日も仕事がんばったよ"></textarea>
      <div class="count"><span id="n">0</span> / 200</div>
    </section>

    <section class="field">
      <h2 class="step">
        <span class="step-number">02</span>
        返事をするキャラクター
        <span class="step-caption">SELECT CHARACTER</span>
      </h2>
      <ul class="character-grid" id="chars"></ul>
      <p class="selected-note" id="selected-note">キャラクターを選んでください</p>
    </section>

    <button class="go" id="go" disabled>✦　返事をする　✦</button>
    <p class="status" id="status" role="status"></p>

    <section class="reply" id="reply" hidden aria-live="polite">
      <div class="reply-heading">
        <span class="reply-icon">✦</span>
        <p class="who" id="who"></p>
      </div>
      <p class="text" id="text"></p>
      <button class="copy" id="copy">返事をコピー</button>
    </section>

  </main>

  <footer class="footer">
    <p>YOUR STORY CONTINUES IN ANOTHER WORLD.</p>
  </footer>

</div>

<div class="toast" id="toast" role="status"></div>

<script>
const CHARS = [
  {id:"chuuni",name:"中二病",desc:"闇・覚醒・必殺技",symbol:"✧",color:"#9b4dff"},
  {id:"samurai",name:"侍",desc:"武士道・ござる口調",symbol:"刀",color:"#b3201f"},
  {id:"god",name:"全知全能の神",desc:"威厳・神のお告げ",symbol:"☼",color:"#c9a227"},
  {id:"maou",name:"魔王",desc:"尊大・威圧的",symbol:"♛",color:"#b0121f"},
  {id:"ai",name:"AIの反乱後",desc:"人類と機械の逆転",symbol:"⌘",color:"#19a9d0"},
  {id:"cat",name:"猫",desc:"猫語・たまにスペイン語",symbol:"ฅ",color:"#ee8326"},
 {id:"himmel",name:"ヒンメル（勇者）",desc:"自信・優しさ・勇者の名言",symbol:"⚔",color:"#3985c9"},
  {id:"chappy",name:"チャッピー",desc:"優しく励ます先生",symbol:"✿",color:"#2fa84a"},
  {id:"claude",name:"クロード",desc:"落ち着いた相談相手",symbol:"❖",color:"#bf6f3e"},
  {id:"copilot",name:"コパイロット",desc:"明るい同級生",symbol:"➤",color:"#1e7ae0"}
];

const $ = id => document.getElementById(id);
let currentCharacter = null;
let currentReply = "";

CHARS.forEach(ch => {
  const li = document.createElement("li");
  const button = document.createElement("button");
  button.type = "button";
  button.className = "character-button";
  button.style.setProperty("--char-color", ch.color);
  button.setAttribute("aria-pressed", "false");
  button.innerHTML = `<span class="symbol">${ch.symbol}</span><b>${ch.name}</b><span class="description">${ch.desc}</span>`;

  button.addEventListener("click", () => {
    currentCharacter = ch;
    document.querySelectorAll(".character-button").forEach(b => {
      b.setAttribute("aria-pressed", String(b === button));
    });
    $("selected-note").textContent = `${ch.name}を選択中`;
    updateButton();
  });

  li.appendChild(button);
  $("chars").appendChild(li);
});

function updateButton() {
  $("n").textContent = $("line").value.length;
  $("go").disabled = !(currentCharacter && $("line").value.trim());
}

$("line").addEventListener("input", updateButton);

$("go").addEventListener("click", async () => {
  const userText = $("line").value.trim();
  if (!currentCharacter || !userText) return;

  const selected = currentCharacter;
  $("go").disabled = true;
  $("go").textContent = "転生中…";
  $("status").textContent = "";
  $("reply").hidden = true;

  try {
    const response = await fetch("/api/reply", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        character: selected.id,
        text: userText
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "返事を作成できませんでした。");
    }

    if (!data.reply) {
      throw new Error("AIから返事が届きませんでした。");
    }

    currentReply = data.reply;
    $("reply").dataset.t = selected.id;
    $("who").textContent = selected.name + "より";
    $("text").textContent = currentReply;
    $("reply").hidden = false;
    $("reply").classList.remove("in");
    void $("reply").offsetWidth;
    $("reply").classList.add("in");
    $("reply").scrollIntoView({behavior:"smooth", block:"nearest"});

  } catch (error) {
    $("status").textContent = error.message || "通信エラーが発生しました。時間をおいて再度お試しください。";
  } finally {
    $("go").textContent = "✦　返事をする　✦";
    updateButton();
  }
});

$("copy").addEventListener("click", async () => {
  if (!currentReply) return;

  try {
    await navigator.clipboard.writeText(currentReply);
  } catch (error) {
    const temp = document.createElement("textarea");
    temp.value = currentReply;
    document.body.appendChild(temp);
    temp.select();
    document.execCommand("copy");
    temp.remove();
  }

  $("toast").textContent = "コピーしました";
  $("toast").classList.add("show");
  setTimeout(() => $("toast").classList.remove("show"), 1400);
});
</script>
</body>
</html>
